[package]
name = "newsqueue-core"
version = "1.0.8"
edition = "2021"
description = "NewsQueue engine: NNTP/yEnc downloader, NZB, PAR2, unrar, RSS, settings and queue. No UI."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.36"
chrono = "0.4"
fs2 = "0.4"
native-tls = "0.2"
ureq = { version = "3.5", default-features = false, features = ["native-tls", "gzip", "charset"] }
