[package]
name = "newsqueue-web"
version = "1.0.9"
edition = "2024"
description = "NewsQueue web UI: the egui front end compiled to WebAssembly, talking to newsqueue-server."

[features]
ui-audit = []

[dependencies]
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ehttp = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Storage", "HtmlCanvasElement", "Element", "HtmlInputElement", "FileList", "File", "Blob", "EventSource", "MessageEvent", "Event", "MediaQueryList"] }
