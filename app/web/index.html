<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewsQueue</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#d4d0c8}
canvas{display:block;width:100%;height:100%;outline:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:12px Tahoma,Verdana,sans-serif;color:#000}
@media (prefers-color-scheme:dark){html,body{background:#3c3c3e}#loading{color:#fff}}
</style>
</head>
<body>
<canvas id="nq"></canvas>
<div id="loading">Loading NewsQueue...</div>
<script type="module">
import init from "./pkg/newsqueue-web.js";
init().then(() => document.getElementById("loading").remove())
  .catch(e => { document.getElementById("loading").textContent = "Failed to load: " + e; });
</script>
</body>
</html>
