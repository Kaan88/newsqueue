[package]
name = "newsqueue-win32"
version = "1.0.5"
edition = "2021"
description = "NewsQueue native Win32 front end (GUI_PLAN Phase 2)."

[dependencies]
newsqueue-core = { path = "../core" }
png = "0.17"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Shell",
  "Win32_Storage_Xps", "Win32_UI_Input_KeyboardAndMouse",
]
