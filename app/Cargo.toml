[package]
name = "newsqueue"
version = "1.0.2"
edition = "2021"

[dependencies]
eframe = "0.29"
egui_extras = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
quick-xml = "0.36"
chrono = "0.4"
fs2 = "0.4"
native-tls = "0.2"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip", "charset"] }

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = 2
