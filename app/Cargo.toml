[package]
name = "newsqueue"
version = "1.0.4"
edition = "2024"

[workspace]
members = [".", "core"]
default-members = [".", "core"]

[dependencies]
egui = "0.37"
newsqueue-core = { path = "core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
egui_extras = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
native-tls = "0.2"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip", "charset"] }

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = 2
