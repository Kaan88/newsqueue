[package]
name = "newsqueue"
version = "1.0.10"
edition = "2021"
default-run = "newsqueue"

[workspace]
members = [".", "core", "server", "web"]
default-members = [".", "core", "server"]

[dependencies]
newsqueue-core = { path = "core" }
newsqueue-server = { path = "server" }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
native-tls = "0.2"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip", "charset"] }

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Shell",
  "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Storage_Xps",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Ole", "Win32_System_ProcessStatus", "Win32_System_Threading",
]

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = 2
