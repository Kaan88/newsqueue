services:
  newsqueue:
    build: .
    image: newsqueue
    restart: unless-stopped
    ports:
      - "127.0.0.1:8480:8480"
    environment:
      # Put the key in a .env file beside this one: NQ_API_KEY=...
      NQ_API_KEY: ${NQ_API_KEY:?set NQ_API_KEY in .env}
    volumes:
      - ./docker/config:/config
      - ./docker/downloads:/downloads
    # Ctrl+C / docker stop sends SIGTERM; the server saves its state and exits.
    stop_grace_period: 15s
