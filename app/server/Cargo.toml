[package]
name = "newsqueue-server"
version = "1.0.7"
edition = "2021"
description = "NewsQueue headless server: the engine plus a JSON HTTP API (GUI_PLAN Phase 1)."

[dependencies]
newsqueue-core = { path = "../core" }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }
native-tls = "0.2"
ctrlc = { version = "3", features = ["termination"] }
