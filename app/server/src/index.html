<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewsQueue</title>
<style>
:root{--bg:#f4f4f2;--panel:#fff;--line:#d9d9d4;--text:#1d1d1b;--muted:#6b6b66;--accent:#2f6fde;--bar:#2f6fde;--done:#9a9a94;--bad:#c4372c;--hover:#eef2fb}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--panel:#202124;--line:#33353a;--text:#e6e6e3;--muted:#9a9b98;--accent:#6c9bff;--bar:#4f86f7;--done:#5c5d60;--bad:#ff6b5e;--hover:#272a31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 "IBM Plex Sans",system-ui,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0}
header h1{font-size:15px;margin:0 12px 0 0}
button,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer}
button:hover{background:var(--hover)}
.stat{color:var(--muted);margin-left:auto;white-space:nowrap}
main{padding:12px 16px;max-width:1200px;margin:0 auto}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
th,td{padding:5px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px}
td.subj{white-space:normal;word-break:break-word;width:100%}
tr:hover td{background:var(--hover)}
.prog{width:120px;height:12px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--bar)}
.prog.done i{background:var(--done)}
.acts button{padding:2px 6px;font-size:12px}
#drop{margin:12px 0;padding:14px;border:2px dashed var(--line);border-radius:6px;text-align:center;color:var(--muted)}
#drop.over{border-color:var(--accent);color:var(--accent)}
#log{background:var(--panel);border:1px solid var(--line);padding:8px;font:12px/1.4 "IBM Plex Mono",Consolas,monospace;max-height:240px;overflow:auto;white-space:pre-wrap}
.err{color:var(--bad)}
#login{max-width:360px;margin:80px auto;background:var(--panel);border:1px solid var(--line);padding:20px;border-radius:6px}
#login input{width:100%;font:inherit;padding:6px;margin:8px 0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:4px}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<div id="login" hidden>
  <h2>NewsQueue</h2>
  <p>This server needs an API key.</p>
  <input id="key" type="password" autocomplete="current-password" placeholder="API key">
  <button id="save">Sign in</button> <span id="loginerr" class="err"></span>
</div>
<div id="app" hidden>
<header>
  <h1>NewsQueue</h1>
  <button id="pause">Pause</button>
  <button id="conn">Connect</button>
  <select id="limit" title="Speed limit">
    <option value="none">No limit</option>
    <option value="0">Limit 1</option><option value="1">Limit 2</option><option value="2">Limit 3</option>
  </select>
  <button id="cleanup">Clean up</button>
  <label><button id="addbtn">Add NZB…</button><input id="file" type="file" accept=".nzb" multiple hidden></label>
  <span class="stat" id="stat"></span>
</header>
<main>
  <div class="wrap"><table>
    <thead><tr><th>Subject</th><th>Status</th><th>Size</th><th>Left</th><th>Progress</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div id="drop">Drop .nzb files here</div>
  <h3>Log</h3>
  <div id="log"></div>
</main>
</div>
<script>
"use strict";
let key = "";
try { key = localStorage.getItem("nq-key") || ""; } catch (e) {}
const $ = id => document.getElementById(id);
function fmt(b){b=Number(b)||0;const u=["B","KB","MB","GB","TB"];let i=0;while(b>=1024&&i<4){b/=1024;i++}return (i?b.toFixed(1):b)+" "+u[i]}
async function api(method, path, body){
  const r = await fetch(path, {method, headers: key ? {"X-Api-Key": key} : {}, body});
  if (r.status === 401) { showLogin("Wrong or missing API key."); throw new Error("401"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function showLogin(msg){ $("app").hidden = true; $("login").hidden = false; $("loginerr").textContent = msg || ""; }
$("save").onclick = () => { key = $("key").value; try { localStorage.setItem("nq-key", key); } catch (e) {} $("login").hidden = true; refresh(); };
$("key").onkeydown = e => { if (e.key === "Enter") $("save").click(); };
let state = null;
const post = p => api("POST", p).then(refresh).catch(e => alert(e.message));
$("pause").onclick = () => post(state && state.paused ? "/api/resume" : "/api/pause");
$("conn").onclick = () => post(state && state.connected ? "/api/disconnect" : "/api/connect");
$("cleanup").onclick = () => post("/api/cleanup");
$("limit").onchange = e => post("/api/speed-limit?tag=" + e.target.value);
$("addbtn").onclick = e => { e.preventDefault(); $("file").click(); };
$("file").onchange = e => upload(e.target.files);
const drop = $("drop");
["dragenter","dragover"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(t => document.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
document.addEventListener("drop", e => upload(e.dataTransfer.files));
async function upload(files){
  for (const f of files) {
    try { await api("POST", "/api/nzb?name=" + encodeURIComponent(f.name), await f.arrayBuffer()); }
    catch (e) { alert(f.name + ": " + e.message); }
  }
  $("file").value = ""; refresh();
}
function act(id, a){
  if (a === "delete" && !confirm("Remove this item from the queue?")) return;
  if (a === "password") {
    const p = prompt("Archive password"); if (!p) return;
    return api("POST", `/api/queue/${id}/password`, p).then(refresh).catch(e => alert(e.message));
  }
  post(`/api/queue/${id}/${a}`);
}
function render(s){
  state = s;
  $("app").hidden = false;
  $("pause").textContent = s.paused ? "Resume" : "Pause";
  $("conn").textContent = s.connected ? "Disconnect" : "Connect";
  $("stat").textContent = `${fmt(s.speed_bps)}/s · ${fmt(s.queue_remaining_bytes)} left` + (s.speed_limit_bps > 0 ? ` · limit ${fmt(s.speed_limit_bps)}/s` : "");
  const sig = JSON.stringify(s.queue);
  if (sig !== lastQueue) { lastQueue = sig; renderRows(s); }
  renderLog(s);
}
let lastQueue = "";
function renderRows(s){
  const tb = $("rows"); tb.textContent = "";
  for (const r of s.queue) {
    const tr = document.createElement("tr");
    const st = r.status || "";
    const pct = Math.max(0, Math.min(100, r.progress * 100));
    const cells = [r.subject, st, fmt(r.total_bytes), fmt(r.remaining_bytes)];
    cells.forEach((t, i) => { const td = document.createElement("td"); td.textContent = t; if (!i) td.className = "subj"; tr.appendChild(td); });
    const pt = document.createElement("td");
    pt.innerHTML = `<div class="prog${pct >= 100 ? " done" : ""}"><i style="width:${pct.toFixed(1)}%"></i></div>`;
    tr.appendChild(pt);
    const at = document.createElement("td"); at.className = "acts";
    const paused = /pause/i.test(st);
    [[paused ? "resume" : "pause", paused ? "▶" : "⏸"], ["top","⤒"], ["up","↑"], ["down","↓"], ["unpack","Unpack"], ["password","🔑"], ["delete","✕"]]
      .forEach(([a, l]) => { const b = document.createElement("button"); b.textContent = l; b.title = a; b.onclick = () => act(r.id, a); at.appendChild(b); });
    tr.appendChild(at);
    tb.appendChild(tr);
  }
  if (!s.queue.length) tb.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">Queue is empty.</td></tr>';
}
function renderLog(s){
  const log = $("log"); const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  log.textContent = s.log_tail.map(l => `${l.time}  ${l.level.padEnd(6)} ${l.message}`).join("\n");
  if (atEnd) log.scrollTop = log.scrollHeight;
}
let timer;
async function refresh(){
  clearTimeout(timer);
  try { render(await api("GET", "/api/state")); } catch (e) { if (e.message !== "401") $("stat").textContent = "offline: " + e.message; }
  if ($("login").hidden) timer = setTimeout(refresh, 1000);
}
refresh();
</script>
</body>
</html>
