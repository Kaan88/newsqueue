name: Docker release
on:
  workflow_dispatch:
    inputs:
      publish_assets:
        description: Attach verified artifacts to the release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux amd64 image
        run: docker build --platform linux/amd64 -t newsqueue:1.0.9 app
      - name: Validate Compose and container
        env:
          NQ_API_KEY: isolated-container-release-test
        run: |
          docker compose -f app/compose.yaml config --quiet
          python3 app/docker-smoke.py
      - name: Package image and web build
        run: |
          mkdir release-output
          docker save newsqueue:1.0.9 | gzip -1 > release-output/NewsQueue-1.0.9-linux-amd64.tar.gz
          id=$(docker create newsqueue:1.0.9)
          docker cp "$id:/opt/newsqueue/web" release-output/web
          docker rm "$id"
          (cd release-output/web && zip -qr ../NewsQueue-1.0.9-web.zip .)
          git archive --format=zip --prefix=NewsQueue-1.0.9/ HEAD > release-output/NewsQueue-1.0.9-source.zip
          cp app/compose.yaml app/env.example app/DOCKER.md release-output/
          cd release-output
          sha256sum *.tar.gz *.zip compose.yaml env.example DOCKER.md > NewsQueue-1.0.9-SHA256SUMS.txt
      - name: Retain candidate artifacts for audit
        uses: actions/upload-artifact@v4
        with:
          name: newsqueue-1.0.9-linux-candidate
          path: |
            release-output/*.tar.gz
            release-output/*.zip
            release-output/*.txt
            release-output/compose.yaml
            release-output/env.example
            release-output/DOCKER.md
          retention-days: 7
      - name: Attach Linux and web artifacts to release
        if: ${{ inputs.publish_assets }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.9 release-output/*.tar.gz release-output/*.zip release-output/compose.yaml release-output/env.example release-output/DOCKER.md release-output/*SHA256SUMS.txt
